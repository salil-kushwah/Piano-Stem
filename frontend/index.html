<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Stem Studio — Stem Separation, Transcription & Rousseau Visualizer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="9" y1="3" x2="9" y2="15" />
                    <line x1="15" y1="3" x2="15" y2="15" />
                    <line x1="3" y1="15" x2="21" y2="15" />
                </svg>
            </div>
            <h1>Piano Stem Studio</h1>
            <span class="badge">RTX Accelerated</span>
        </div>

        <div class="header-actions">
            <!-- Theme Color Selector -->
            <div class="select-wrapper">
                <select id="theme-select" class="custom-select" title="Color Theme">
                    <option value="rousseau_cyan" selected>Rousseau Classic (Cyan / Blue)</option>
                    <option value="magenta_neon">Cyber Magenta / Purple</option>
                    <option value="amber_gold">Imperial Amber / Gold</option>
                    <option value="emerald_aura">Emerald Matrix</option>
                </select>
            </div>

            <!-- Audio Stem Selector -->
            <div class="select-wrapper">
                <select id="stem-select" class="custom-select" title="Audio Source">
                    <option value="pure_piano" selected>Concert Grand (SoundFont)</option>
                    <option value="isolated_stem">Piano Stem (Enhanced)</option>
                    <option value="original_mix">Original Mix</option>
                </select>
            </div>

            <button id="new-track-btn" class="btn btn-secondary">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                New Track
            </button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="studio-main">
        <!-- 60FPS Falling Notes & 88-Key Piano Canvas -->
        <canvas id="visualizer-canvas"></canvas>

        <!-- Dropzone (Empty State) -->
        <div id="drop-zone" class="drop-zone">
            <div class="drop-card">
                <div class="drop-icon-pulse">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </div>
                <h2>Drop Your MP3 Audio File</h2>
                <p>Mixed songs with vocals and drums, or solo piano. We isolate the piano stem, transcribe every note & velocity with AI, and render the Rousseau falling notes visualizer.</p>

                <div class="drop-options">
                    <label>
                        <input type="checkbox" id="mixed-checkbox" checked>
                        <span>Extract piano from mixed track (SOTA UVR MDX-Net Inst_HQ)</span>
                    </label>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 10px;">
                    <label for="file-input" class="btn btn-primary" style="cursor: pointer;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                        Browse Audio File
                    </label>
                    <button id="demo-track-btn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                        Try Moonlight Sonata Demo
                    </button>
                </div>

                <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.flac,.m4a" style="display: none;">
            </div>
        </div>

        <!-- Processing Progress Overlay -->
        <div id="processing-overlay" class="processing-overlay">
            <div class="processing-card">
                <div class="spinner-glow"></div>
                <h3 id="progress-message">Analyzing audio track...</h3>
                <div class="progress-track">
                    <div id="progress-bar" class="progress-fill"></div>
                </div>
                <div class="progress-stats">
                    <span id="progress-percent">0%</span>
                    <span>NVIDIA RTX 3050</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Studio Controls Toolbar -->
    <footer id="studio-controls" class="studio-controls" style="display: none;">
        <!-- Play / Pause & Time -->
        <div class="playback-controls">
            <button id="play-btn" class="play-btn" title="Play / Pause (Spacebar)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <div id="time-display" class="time-display">0:00 / 0:00</div>
        </div>

        <!-- Scrubber Timeline -->
        <div class="timeline-container">
            <input type="range" id="time-slider" class="time-slider" min="0" max="100" value="0" step="0.1">
        </div>

        <!-- Practice Tools: Speed & Looping -->
        <div class="loop-controls">
            <button id="loop-a-btn" class="btn-loop" title="Set Start of Practice Loop">Set [A]</button>
            <button id="loop-b-btn" class="btn-loop" title="Set End of Practice Loop">Set [B]</button>
            <button id="loop-clear-btn" class="btn-loop" title="Clear Repeat Loop">&times;</button>

            <select id="speed-select" class="custom-select" style="padding: 4px 8px; font-size: 0.75rem;" title="Playback Speed">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
            </select>
        </div>

        <!-- Export Actions -->
        <div class="export-actions">
            <button id="download-midi-btn" class="btn btn-secondary" title="Export MIDI file for DAW / MuseScore">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Export MIDI
            </button>
            <button id="download-stem-btn" class="btn btn-secondary" title="Export isolated piano audio track">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                Export Piano WAV
            </button>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
